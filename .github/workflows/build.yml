name: Build profile

on:
  push:
    branches: [main]
    paths: ["content.yaml", "tools/**", "requirements.txt"]
  schedule:
    - cron: "23 */6 * * *" # refresh the live panel every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Draw every image, refresh live data, write README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/build.py
          python tools/live.py
          python tools/readme.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          if [ -d data ]; then git add -A data; fi
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild profile"
          git push
